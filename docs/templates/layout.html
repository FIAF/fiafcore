<head>
    <meta charset="utf-8">
    <title>FIAF Knowledge Graph</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='fiafcore.css') }}">
    <link href="https://fonts.googleapis.com/css?family=Nunito:100,200,300,400,500,600,700,800,900" rel="stylesheet" />
    <link href="../static/prism-laserwave.css" rel="stylesheet" />
    <link href="https://unpkg.com/@triply/yasgui/build/yasgui.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/@triply/yasgui/build/yasgui.min.js"></script>
</head>

<body>
    <div style="width: 100%; background-color: white; display: flex; justify-content: center;">
        <div style="width: 800px; background-color: white;  ">
            <div class="menu"
                style="display: flex; justify-content: center; background-color: white;  border-bottom: 1px black solid;">
                <div class="menu-item"><a id="index" href="https://dev.fiafcore.org">Index</a></div>
                <div class="menu-item"><a id="ontology" href="https://dev.fiafcore.org/ontology">Ontology</a></div>
                <div class="menu-item"><a id="sources" href="https://dev.fiafcore.org/sources">Sources</a></div>
                <div class="menu-dropdown menu-item"><span>Access</span>

                    <div class="menu-dropdown-page">
                        <div class="menu-dropdown-div" style="border-top: 1px solid black;">
                            <a href="https://dev.fiafcore.org/search" style="display: inline-block; padding: 8px; white-space: nowrap; width: auto;">
                                Search Interface
                            </a>
                        </div>
                        <div class="menu-dropdown-div">
                            <a href="https://dev.fiafcore.org/sparql" style="padding: 8px; display: inline-block;width: auto; ">
                                SPARQL Query
                            </a>
                        </div>
                    </div>

                </div>

                <div class="menu-item"><a id="licence" href="https://dev.fiafcore.org/licence">Licence</a></div>
            </div>
            {% block content %}{% endblock %}

        </div>
    </div>
</body>
