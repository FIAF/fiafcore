
{% extends 'layout.html' %}

{% block content %}

<!-- notes to extend, YASR should be hidden on page load, during query and if clear is selected. -->
<!-- SPARQL updates, only one entity should be returned, drop duplicates on id column -->

<h4>Work Search</h4>

<div class="search_block">
    <div class="search_field">
        <div style="padding-right:10px">Title</div>
        <input type="text" id='search_work_title' name="label" class="search_text" placeholder="Type something here..." value=""></input>
    </div>

    <div class="search_field">
        <div style="padding-right:10px">Country</div>
        <select id="search_work_country" class="field_value" name="type_id_fk" required>
            <option value="none" > </option>
            {% for v in vocab.country %}
                <option value="{{ v.id }}" >{{ v.label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="search_field">
        <div style="padding-right:10px">Form</div>
        <select id="search_work_form" class="field_value" name="type_id_fk" required>
            <option value="none" > </option>
            {% for v in vocab.form %}
                <option value="{{ v.id }}" >{{ v.label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="search_field">
        <div style="padding-right:10px">Genre</div>
        <select id="search_work_genre" class="field_value" name="type_id_fk" required>
            <option value="none" > </option>
            {% for v in vocab.genre %}
                <option value="{{ v.id }}" >{{ v.label }}</option>
            {% endfor %}
        </select>
    </div>

    <button onclick="work_search()">Search</button>
    <button onclick="work_clear()">Clear</button>
</div>

<div id="search_work_result" style="display:none"></div>

<h4>Agent Search</h4>

<div class="search_block">
    <div class="search_field">
        <div style="padding-right:10px">Name</div>
        <input type="text" id='search_agent_name' name="label" class="search_text" placeholder="Type something here..." value=""></input>
    </div>
    <button onclick="agent_search()">Search</button>
    <button onclick="agent_clear()">Clear</button>
</div>

<div id="search_agent_result" style="display:none"></div>

<br><br>

<script>

async function sparql_query(endpoint, sparql) {
  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Accept': 'application/sparql-results+json',
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: new URLSearchParams({query: sparql})
    });

    if (!response.ok) {
      throw new Error(`Error: http status ${response.status}`);
    }

    const data = await response.json();
    return data;
  } catch (error) {
    console.error("Error", error)
  }
}

function work_search(){
  document.getElementById("search_work_result").style.display = "none";

  const search_work_title = document.getElementById("search_work_title").value;
  const search_work_country = document.getElementById("search_work_country").value;

  console.log(search_work_title, search_work_country)

  if (search_work_country != 'none') {
    country_query = `?work fiaf:hasCountry <${search_work_country}> .`
  } else {
    country_query = ''
  }

  console.log(country_query)

  const sparql = `
    prefix fiaf: <https://dev.fiafcore.org/>
    prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    select distinct ?work (sample(?t2) as ?title) where {
      ?work rdf:type/rdfs:subClassOf* fiaf:Work .
      ?work fiaf:hasTitle ?t1 .
      ?t1 fiaf:hasTitleValue ?t2 .
      filter(contains(lcase(str(?t2)), "${search_work_title}"))
      ${country_query}
    }
    group by ?work
  `;

  console.log('@@@', sparql)

  endpoint = 'https://data.fiafcore.org'
  sparql_query(endpoint, sparql).then(result => {
    search_work_yasr.setResponse(result);
    document.getElementById("search_work_result").style.display = "block";
  });
}

function work_clear(){
  document.getElementById("search_work_title").value = "";
  document.getElementById("search_work_result").style.display = "none";
}

let search_work_yasr = new Yasr(document.getElementById("search_work_result"));

function agent_search(){
  document.getElementById("search_agent_result").style.display = "none";
  const search_agent_name = document.getElementById("search_agent_name").value;
  const sparql = `
    prefix fiaf: <https://dev.fiafcore.org/>
    prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    select distinct ?agent (sample(?n) as ?name) where {
      ?agent rdf:type/rdfs:subClassOf* fiaf:Agent .
      ?agent rdfs:label ?n .
      filter(contains(lcase(str(?n)), "${search_agent_name}"))
    }
    group by ?agent
  `;

  endpoint = 'https://data.fiafcore.org'
  sparql_query(endpoint, sparql).then(result => {
    search_agent_yasr.setResponse(result);
    document.getElementById("search_agent_result").style.display = "block";
  });
}

function agent_clear(){
  document.getElementById("search_agent_name").value = "";
  document.getElementById("search_agent_result").style.display = "none";
}

let search_agent_yasr = new Yasr(document.getElementById("search_agent_result"));

</script>

<script>
  document.getElementById("access").style.fontWeight = 'Bold';
</script>

{% endblock %}
